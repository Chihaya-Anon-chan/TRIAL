defaults:
  - ppo_trainer
  - _self_

data:
  gen_batch_size: ${data.train_batch_size}
  train_batch_size: 16
  val_batch_size: 128
  max_prompt_length: 4096
  max_response_length: 512
  return_raw_chat: true
  filter_overlong_prompts: true
  truncation: error

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false

actor_rollout_ref:
  actor:
    policy_loss:
      loss_mode: trial
    use_kl_loss: false
    optim:
      lr: 1.0e-6
    ppo_mini_batch_size: 64
    ppo_micro_batch_size_per_gpu: 8
    fsdp_config:
      param_offload: false
      optimizer_offload: false
    trial:
      outcome_view: trajectory_context
      dense_coef: 0.01
      gap_clip: 2.0
      warmup_steps: 25
      outcome_loss_clamp_ratio: 1.0
      aux_token_scope: response
      aux_valid_row_gate: true
  model:
    use_remove_padding: true
    enable_gradient_checkpointing: true
  ref:
    fsdp_config:
      param_offload: true
  rollout:
    mode: sync
    tensor_model_parallel_size: 1
    log_prob_micro_batch_size_per_gpu: 16
    gpu_memory_utilization: 0.60
    enable_chunked_prefill: false
    enforce_eager: false
    free_cache_engine: false
    val_kwargs:
      temperature: 0.4
      do_sample: true

trainer:
  project_name: trial
  experiment_name: trial_run
  total_epochs: 150
  total_training_steps: null
  n_gpus_per_node: 8
  nnodes: 1
  save_freq: 25
  test_freq: 25
  logger: [console]
  critic_warmup: 0
  val_before_train: true
  resume_mode: disable
  default_local_dir: outputs/${trainer.experiment_name}

env:
  seed: 0
  history_length: 2
  resources_per_worker:
    num_cpus: 0.2
    num_gpus: 0
  rollout:
    n: 8
  alfworld:
    eval_dataset: eval_in_distribution
    fixed_eval_games: false
  webshop:
    use_small: true
    human_goals: false
    fixed_eval_goals: false
